<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Freelancer</title>
<link rel="stylesheet" href="css/estilo.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div id="tela-carregando">
    <div class="logo">CRM <span>Freelancer</span></div>
    <div class="carregando-spinner"></div>
  </div>

  <div class="app" style="display:none;">

    <!-- Barra lateral -->
    <aside class="barra-lateral">
      <div class="logo">CRM <span>Freelancer</span></div>
      <nav class="menu">
        <button class="menu-item ativo" data-pagina="painel">📊 Painel</button>
        <button class="menu-item" data-pagina="calculadora">🧮 Calculadora</button>
        <button class="menu-item" data-pagina="clientes">👤 Clientes</button>
        <button class="menu-item" data-pagina="funil">📋 Funil de Vendas</button>
        <button class="menu-item" data-pagina="orcamentos">📄 Orçamentos</button>
        <button class="menu-item" data-pagina="prospeccao">🔎 Prospecção</button>
        <button class="menu-item" data-pagina="configuracoes">⚙️ Configurações</button>
      </nav>
      <button id="btn-tema" class="btn-tema">🌙 Tema</button>
    </aside>

    <!-- Conteúdo principal -->
    <main class="conteudo">

      <header class="topo">
        <h1 id="titulo-pagina">Painel</h1>
        <div class="status-drive" id="status-drive">💾 Dados salvos localmente</div>
      </header>

      <section id="pagina-painel" class="pagina ativa">
        <div class="cards-resumo">
          <div class="card">
            <span class="card-label">Faturamento no mês</span>
            <span class="card-valor" id="painel-faturamento-mes">R$ 0,00</span>
          </div>
          <div class="card">
            <span class="card-label">Faturamento no ano (MEI)</span>
            <span class="card-valor" id="painel-faturamento-ano">R$ 0,00</span>
            <div class="barra-progresso">
              <div class="barra-progresso-interna" id="painel-barra-mei"></div>
            </div>
            <span class="card-sub" id="painel-mei-texto">0% do limite de R$ 81.000,00</span>
          </div>
          <div class="card">
            <span class="card-label">Clientes ativos</span>
            <span class="card-valor" id="painel-clientes-ativos">0</span>
          </div>
          <div class="card">
            <span class="card-label">Orçamentos em aberto</span>
            <span class="card-valor" id="painel-orcamentos-abertos">0</span>
          </div>
        </div>

        <div class="bloco-destaque">
          <h3>📄 Orçamentos Recentes</h3>
          <table class="tabela">
            <thead><tr><th>Cliente</th><th>Status</th><th>Projeto</th><th>Valor</th></tr></thead>
            <tbody id="painel-orcamentos-recentes"></tbody>
          </table>
        </div>

        <div class="painel-grafico-funil">
          <h3>🔻 Funil de Vendas</h3>
          <div id="painel-funil-resumo" class="funil-barras"></div>
        </div>
      </section>

      <section id="pagina-calculadora" class="pagina"></section>
      <section id="pagina-clientes" class="pagina"></section>
      <section id="pagina-funil" class="pagina"></section>
      <section id="pagina-orcamentos" class="pagina"></section>
      <section id="pagina-prospeccao" class="pagina"></section>
      <section id="pagina-configuracoes" class="pagina"></section>

    </main>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/calculadora.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/funil.js"></script>
  <script src="js/orcamentos.js"></script>
  <script src="js/prospeccao.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
